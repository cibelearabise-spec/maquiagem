<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glow – Aprenda sua make</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* FOTOS: coloque na raiz do repositório (mesma pasta deste index.html):
   batom.jpg  soft.jpg  glow.jpg  clean.jpg  produtos.jpg
   Se o arquivo não existir, aparece um fundo com emoji no lugar. */
:root{--ink:#1f1a2e;--mute:#6a6382;--acc:#6d3fc0;--acc2:#eadffb;--glass:rgba(255,255,255,.52);--gb:rgba(255,255,255,.75);--btn:#241a3d;--btnink:#fff;--sh:rgba(109,63,192,.16);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#f4effd;--mute:#b0a8c8;--acc:#b696f5;--acc2:#3b3057;--glass:rgba(48,40,70,.5);--gb:rgba(255,255,255,.14);--btn:#eadffb;--btnink:#1f1a2e;--sh:rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--ink:#f4effd;--mute:#b0a8c8;--acc:#b696f5;--acc2:#3b3057;--glass:rgba(48,40,70,.5);--gb:rgba(255,255,255,.14);--btn:#eadffb;--btnink:#1f1a2e;--sh:rgba(0,0,0,.35)}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{color:var(--ink);font:16px/1.5 "DM Sans",system-ui,sans-serif;background:#eeeaf5;position:relative}
/* fundo com nuances: seda lavanda, rosé e pérola */
body::before{content:"";position:fixed;inset:0;z-index:-1;
background:
 radial-gradient(60% 40% at 15% 8%,rgba(255,255,255,.95),transparent 70%),
 radial-gradient(55% 45% at 90% 20%,rgba(214,196,245,.85),transparent 70%),
 radial-gradient(50% 40% at 5% 60%,rgba(248,208,225,.6),transparent 70%),
 radial-gradient(60% 50% at 85% 90%,rgba(190,170,235,.7),transparent 70%),
 linear-gradient(160deg,#f6f3fb,#e6def3 55%,#efe6f4)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) body::before{background:radial-gradient(55% 40% at 90% 15%,rgba(120,80,190,.5),transparent 70%),radial-gradient(50% 40% at 5% 70%,rgba(160,80,130,.3),transparent 70%),linear-gradient(160deg,#1a1526,#151120)}}
main{max-width:460px;margin:0 auto;padding:18px 18px 34px;min-height:100vh;display:flex;flex-direction:column}
h1{font:600 33px/1.15 Fraunces,Georgia,serif;margin:16px 0 8px;letter-spacing:-.01em;text-align:center}
h1 em{color:var(--acc);font-style:normal}
p{margin:0 0 14px;color:var(--mute)}
.c{text-align:center}
.pill{align-self:center;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--gb);color:var(--acc);border-radius:99px;padding:6px 14px;font-size:13px;font-weight:600}
.glass{background:var(--glass);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);border:1px solid var(--gb);box-shadow:0 10px 30px var(--sh),inset 0 1px 0 rgba(255,255,255,.6)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.opt{border-radius:24px;padding:10px 10px 14px;text-align:left;color:var(--ink);font:inherit;cursor:pointer;transition:transform .15s,border-color .15s}
.opt:active{transform:scale(.97)}.opt:hover,.opt:focus-visible{outline:2px solid var(--acc)}
.ph{position:relative;aspect-ratio:1.1;border-radius:16px;overflow:hidden;display:grid;place-items:center;font-size:44px;margin-bottom:10px;background:linear-gradient(135deg,var(--acc2),#f7dbe8)}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.opt b{display:block;font-size:15px}.opt small{color:var(--mute);font-size:13px}
.btn{background:var(--btn);color:var(--btnink);border:0;border-radius:99px;padding:17px;font:600 16px "DM Sans",sans-serif;width:100%;cursor:pointer;margin-top:auto;box-shadow:0 10px 24px var(--sh)}
.center{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.orb{width:180px;height:180px;border-radius:50%;display:grid;place-items:center;font-size:80px;margin:20px 0;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06);box-shadow:0 0 0 18px var(--acc2)}}
.hero{border-radius:28px;padding:10px;margin:8px 0 6px}
.hero .ph{aspect-ratio:1.05;font-size:90px;margin:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{background:var(--acc2);color:var(--acc);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600}
.tabs{display:flex;gap:6px;margin:12px 0 10px}
.tab{flex:1;border:1px solid var(--gb);background:var(--glass);color:var(--mute);border-radius:16px;padding:9px 2px;font:600 12px "DM Sans",sans-serif;cursor:pointer;line-height:1.25;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.tab[aria-selected="true"]{background:var(--acc2);color:var(--acc);border-color:var(--acc)}
.bar{height:6px;background:var(--gb);border-radius:9px;overflow:hidden;margin:4px 0 14px}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .3s}
.tip{border-radius:18px;padding:12px 14px;font-size:14px;margin-bottom:12px;position:relative;overflow:hidden}
.shine::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.75) 50%,transparent 65%);transform:translateX(-120%);animation:sweep 3.2s ease-in-out infinite;pointer-events:none}
@keyframes sweep{60%,100%{transform:translateX(120%)}}
@media (prefers-reduced-motion:reduce){.orb,.shine::after{animation:none}}
.step{display:flex;gap:12px;align-items:flex-start;border-radius:20px;padding:14px;margin-bottom:9px;cursor:pointer;text-align:left;width:100%;color:var(--ink);font:inherit}
.step[aria-checked="true"]{opacity:.62}.step[aria-checked="true"] b{text-decoration:line-through}
.chk{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--acc);display:grid;place-items:center;color:transparent;font-size:14px;margin-top:2px}
.step[aria-checked="true"] .chk{background:var(--acc);color:#fff}
.step b{display:block}.step .d{font-size:14px;color:var(--mute)}
.back{background:none;border:0;color:var(--mute);font:500 14px "DM Sans",sans-serif;cursor:pointer;padding:4px 0;align-self:flex-start}
.done{text-align:center;padding:12px;color:var(--acc);font-weight:600}
.note{font-size:12px;text-align:center;margin-top:14px}
</style>
</head>
<body>
<main id="app"></main>
<script>
const V={
 glam:{ic:"💄",img:"batom.jpg",n:"Ousada & glam",sub:"Marcante, confiante, inesquecível",t:"Make <em>glam</em> & <em>ousada</em>",d:"Cores intensas e acabamento impecável.",
  tips:["Deixe o centro do rosto mais matte e uniforme.","Aplique o iluminador só nos pontos altos, com precisão.","Esfumado em marrom ou bordô com delineado gráfico.","Contorne o lábio e coloque gloss só no centro."]},
 soft:{ic:"🌸",img:"soft.jpg",n:"Suave & romântica",sub:"Delicada, calmante, cheia de cuidado",t:"Make <em>suave</em> & <em>romântica</em>",d:"Tons rosados e um brilho de aquarela.",
  tips:["Prefira texturas leves e cremosas.","Blush rosado bem esfumado nas maçãs.","Sombra rosé ou pêssego e cílios curvados.","Gloss rosado transparente, sem contorno."]},
 glow:{ic:"✨",img:"glow.jpg",n:"Glow & radiância",sub:"Pele viçosa, luminosa, natural",t:"Make <em>glow</em> & <em>radiância</em>",d:"Pele luminosa e beleza sem esforço.",
  tips:["Hidrate em dobro: a luz só brilha em pele bem cuidada.","Misture um pouco de iluminador líquido na base para brilhar de dentro.","Sombra champanhe em creme e iluminador no canto interno.","Gloss cristal sobre bálsamo hidratante."]},
 nat:{ic:"🌿",img:"clean.jpg",n:"Limpa & natural",sub:"Simples, pura, sem esforço",t:"Make <em>limpa</em> & <em>natural</em>",d:"Pouca make, pele de verdade e frescor.",
  tips:["Use só o necessário: sérum e corretivo onde precisa.","Um toque de cor nas bochechas com o dedo.","Sombra bege e uma camada fina de máscara.","Gloss incolor ou um bálsamo com cor."]}
};
const S=[
 {n:"Preparo de pele",ic:"🧴",steps:[
  ["Limpe o rosto","Sabonete suave, massagem de 30 segundos e seque sem esfregar.","Neutrogena, La Roche-Posay, Nivea"],
  ["Hidrate","Hidratante em todo o rosto e pescoço. Espere 2 minutos.","Nivea, Cetaphil, Vichy"],
  ["Protetor solar","Cubra rosto e pescoço, mesmo em casa.","Isdin, Episol, La Roche-Posay"],
  ["Primer","Camada fina só na zona T e onde os poros aparecem.","Maybelline, Vult, Ruby Rose"],
  ["Base em camadas finas","Comece pelo centro e esfume para fora com esponja úmida.","L'Oréal, Maybelline, Boca Rosa Beauty"],
  ["Corretivo","Toque nas olheiras e ao lado do nariz. Batidinhas, sem arrastar.","Ruby Rose, Mari Maria, Fenty Beauty"]]},
 {n:"Brilho na pele",ic:"✨",shine:1,steps:[
  ["Sérum de luminosidade","Aplique antes da base para a pele ficar viçosa.","Vichy, The Ordinary, Principia"],
  ["Skin tint ou base leve","Cobertura leve, para a pele aparecer por baixo.","Rare Beauty, Bruna Tavares, Natura"],
  ["Blush cremoso","Sorria e toque nas maçãs, esfumando para as têmporas.","Rare Beauty, Mari Maria, Boca Rosa Beauty"],
  ["Iluminador","Maçãs, ponte do nariz, arco do cupido e canto interno dos olhos.","Fenty Beauty, Vult, Ruby Rose"],
  ["Spray fixador glow","Borrife a um braço de distância e deixe secar sozinho.","MAC, Urban Decay, Vult"]]},
 {n:"Maquiagem de olhos",ic:"👁️",steps:[
  ["Alinhe as sobrancelhas","Penteie os fios e preencha as falhas com traços curtos.","Vult, Ruby Rose, Benefit"],
  ["Primer de pálpebra","Ajuda a sombra a durar e a ficar uniforme.","Urban Decay, Maybelline"],
  ["Sombra base","Um tom neutro em toda a pálpebra móvel.","Ruby Rose, Mari Maria, Urban Decay"],
  ["Esfume na dobra","Pincel macio, movimentos de vai e vem.","Ruby Rose, Vult"],
  ["Delineador","Da metade da pálpebra até o canto externo, traço fino.","Maybelline, Vult"],
  ["Máscara de cílios","Do centro para fora, em zigue-zague na raiz.","Maybelline, L'Oréal, Bruna Tavares"]]},
 {n:"Finalização com gloss",ic:"💋",steps:[
  ["Prepare os lábios","Esfolie de leve e passe um bálsamo.","Carmex, Nivea, Vult"],
  ["Contorne (opcional)","Lápis no tom natural do lábio define o desenho.","Ruby Rose, MAC"],
  ["Aplique o gloss","Comece no centro do lábio inferior e pressione os lábios.","Fenty Beauty, O Boticário, Vult"],
  ["Harmonize o rosto","Retoque blush e iluminador para combinar com o gloss.","Rare Beauty, Fenty Beauty"]]}
];
let st={screen:"home",vibe:null,tab:0,done:{}};
try{const s=JSON.parse(localStorage.getItem("glowmake")||"null");if(s&&s.vibe){st.vibe=s.vibe;st.done=s.done||{};st.screen="lesson"}}catch(e){}
const save=()=>{try{localStorage.setItem("glowmake",JSON.stringify({vibe:st.vibe,done:st.done}))}catch(e){}};
const $=document.getElementById("app");
const go=s=>{st.screen=s;render();scrollTo(0,0)};
function pick(v){st.vibe=v;st.done={};st.tab=0;save();go("loading");setTimeout(()=>st.screen==="loading"&&go("intro"),1600)}
function toggle(i){const k=st.tab+"-"+i;st.done[k]=!st.done[k];save();render()}
const img=(src,e)=>`<div class="ph"><span>${e}</span><img src="${src}" alt="" onerror="this.remove()"></div>`;
function render(){
 const v=V[st.vibe];
 if(st.screen==="home")$.innerHTML=`<span class="pill">Aula de make</span>
  <h1>Aprenda sua make <em>passo a passo</em></h1>
  <p class="c">Escolha o estilo que quer aprender agora.</p>
  <div class="grid">${Object.entries(V).map(([k,x])=>`<button class="opt glass" onclick="pick('${k}')">${img(x.img,x.ic)}<b>${x.n}</b><small>${x.sub}</small></button>`).join("")}</div>`;
 else if(st.screen==="loading")$.innerHTML=`<div class="center"><span class="pill">Preparando sua aula</span><div class="orb glass">🌸</div>
  <h1>Sua aula está carregando…</h1><p>Separando os passos e as marcas para o seu estilo.</p></div>`;
 else if(st.screen==="intro")$.innerHTML=`<button class="back" onclick="go('home')">← Trocar estilo</button><span class="pill">Sua aula</span>
  <h1>${v.t}</h1><p class="c">${v.d} Você vai aprender 4 etapas: preparo de pele, brilho na pele, olhos e finalização com gloss.</p>
  <div class="hero glass">${img("produtos.jpg","🧴")}</div>
  <div class="chips" style="justify-content:center;margin:10px 0 18px"><span class="chip">Maybelline</span><span class="chip">Vult</span><span class="chip">Ruby Rose</span><span class="chip">Fenty Beauty</span><span class="chip">Rare Beauty</span><span class="chip">MAC</span></div>
  <button class="btn" onclick="go('lesson')">Começar a aula</button>`;
 else{
  const s=S[st.tab],tot=s.steps.length,n=s.steps.filter((_,i)=>st.done[st.tab+"-"+i]).length;
  $.innerHTML=`<button class="back" onclick="go('intro')">← ${v.n}</button>
  <h1 style="text-align:left;margin-top:2px">${s.ic} ${s.n}</h1>
  <div class="tabs" role="tablist">${S.map((x,i)=>`<button class="tab" role="tab" aria-selected="${i===st.tab}" onclick="st.tab=${i};render()">${x.ic}<br>${x.n}</button>`).join("")}</div>
  <div class="bar"><i style="width:${n/tot*100}%"></i></div>
  <div class="tip glass ${s.shine?"shine":""}"><b>Para o seu estilo:</b> ${v.tips[st.tab]}</div>
  ${s.steps.map((x,i)=>`<button class="step glass" role="checkbox" aria-checked="${!!st.done[st.tab+"-"+i]}" onclick="toggle(${i})"><span class="chk">✓</span><div><b>${x[0]}</b><span class="d">${x[1]}</span><div class="chips">${x[2].split(", ").map(b=>`<span class="chip">${b}</span>`).join("")}</div></div></button>`).join("")}
  ${n===tot?`<div class="done">Etapa concluída!${st.tab<3?"":" Look finalizado ✨"}</div>`:""}
  ${st.tab<3?`<button class="btn" style="margin-top:12px" onclick="st.tab++;render();scrollTo(0,0)">Próxima: ${S[st.tab+1].n}</button>`:""}
  <p class="note">Marcas são sugestões. Confira tons e preços na loja.</p>`;
 }
}
render();
</script>
</body>
</html>
